[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/CODERPP10/MCP-tradebot"

[workspace.dependencies]
domain = { path = "crates/domain" }
kite-client = { path = "crates/kite-client" }
secret-store = { path = "crates/secret-store" }
session = { path = "crates/session" }
ledger = { path = "crates/ledger" }
guardrails = { path = "crates/guardrails" }
engine = { path = "crates/engine" }
telegram-confirm = { path = "crates/telegram-confirm" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
sha2 = "0.10"
hex = "0.4"
url = "2"
wiremock = "0.6"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
base64 = "0.22"
tempfile = "3"
rpassword = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
async-trait = "0.1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
