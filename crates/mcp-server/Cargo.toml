[package]
name = "mcp-server"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "tradebot-mcp"
path = "src/main.rs"

[dependencies]
domain = { workspace = true }
engine = { workspace = true }
guardrails = { workspace = true }
ledger = { workspace = true }
telegram-confirm = { workspace = true }
kite-client = { workspace = true }
secret-store = { workspace = true }
session = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "signal"] }
rmcp = { version = "3", features = ["server", "macros", "schemars", "transport-io"] }

[dev-dependencies]
# `client` drives the real MCP tool layer from tests/end_to_end_paper.rs over an
# in-process duplex pipe; `chrono` is only needed for the fixed test clock.
rmcp = { version = "3", features = ["client"] }
chrono = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
